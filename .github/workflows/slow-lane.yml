name: Slow lane

# Seam 1 — the REST contract, with the real models. Gigabytes of weights and minutes of runtime,
# so it does not run on every push: pull requests into `main`, plus a nightly run. See
# docs/design-decisions.md §9b.
#
# Single OS, deliberately. The fast lane covers Linux and Windows because process teardown and path
# handling differ; model inference does not differ enough to be worth the metered minutes twice.

on:
  pull_request:
    branches: [main]
  schedule:
    # 02:30 UTC nightly. The point is not the tests — the fast lane has usually already said what is
    # broken. The point is the cache: a nightly run on `main` writes a cache that every later pull
    # request can restore, because GitHub only lets a branch read caches from its own ref or the
    # default branch. Without this, the first pull request of the day pays the full download.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: slow-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Seam 1 — REST contract, with models
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/inference/uv.lock

      - name: Work out the weight cache key
        id: weights
        # Keyed on the pinned model versions themselves, not on the manifest file: editing a
        # comment in the manifest should not throw away gigabytes of warm cache.
        run: echo "key=$(python3 tools/fetch_models.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the model weights and the exported graphs
        id: cache
        uses: actions/cache@v4
        with:
          path: models
          # The exporter's own hash is part of the key. The `.onnx` graphs live in this same
          # directory, so a key that tracked only the pinned weights would happily restore graphs
          # produced by a previous version of tools/export_onnx.py and test the wrong maths.
          key: model-weights-${{ steps.weights.outputs.key }}-export-${{ hashFiles('tools/export_onnx.py') }}
          # No restore-keys on purpose. A partial match here would mean weights from a different
          # pinned version, which is worse than a slow download — it would test the wrong model.

      - name: Fetch the model weights from upstream
        if: steps.cache.outputs.cache-hit != 'true'
        # From the publisher, never from a mirror of ours. The SegFormer checkpoint is under a
        # non-commercial research licence: downloading it for development is fine, re-hosting it
        # would be redistribution (§9b, and docs/handoff/custom-wall-segmentation-model.md).
        run: python3 tools/fetch_models.py

      - name: Verify the weights match the manifest
        # Runs on a cache hit too. A cache entry is not evidence: this asserts that what we are
        # about to test with is the file whose licence and version were reviewed.
        run: python3 tools/fetch_models.py --verify

      - name: Export the checkpoints to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: services/inference
        # Only on a cache miss, because this is the expensive half: it installs PyTorch to convert
        # the checkpoints, and the `.onnx` files it writes are cached alongside the weights. The
        # export verifies every graph against the PyTorch model it came from, so a graph that runs
        # but computes something else fails here rather than in a test that looks unrelated.
        run: |
          uv sync --python 3.12 --group export
          uv run python ../../tools/export_onnx.py

      - name: Check the exported graphs are present
        # Runs on a cache hit too, for the same reason the weights are re-verified: a cache entry
        # is not evidence. Deliberately does not re-run the parity check, which would mean
        # installing PyTorch on every run to re-learn what the export already proved.
        run: |
          python3 - <<'CHECK'
          import sys
          from pathlib import Path

          expected = [
              "models/semantic-segformer-b0-ade20k/semantic.onnx",
              "models/semantic-segformer-b0-ade20k/runtime.json",
              "models/refiner-sam2-hiera-tiny/sam2-encoder.onnx",
              "models/refiner-sam2-hiera-tiny/sam2-decoder.onnx",
              "models/refiner-sam2-hiera-tiny/runtime.json",
          ]
          missing = [path for path in expected if not Path(path).exists()]
          for path in expected:
              print(("  ok      " if path not in missing else "  MISSING ") + path)
          if missing:
              sys.exit(f"{len(missing)} exported file(s) missing. The export did not complete.")
          CHECK

      - name: Install the service
        working-directory: services/inference
        # Without the export group, which prunes PyTorch back out of the environment. That is
        # deliberate: the contract tests below then run in an environment shaped like the shipped
        # one, so anything under spectrapaint/ that reached for torch would fail here.
        run: uv sync --python 3.12

      - name: Seam 1 contract tests
        working-directory: services/inference
        # Exit code 5 is "no tests collected". Tests that need weights are marked `models`, and
        # until the segmentation tickets land there are none — that is a legitimately empty lane,
        # not a failure. Any other non-zero code is a real failure.
        run: |
          set +e
          uv run pytest -m models -q
          status=$?
          set -e
          if [ $status -eq 5 ]; then
            echo "No tests marked 'models' yet — the lane is wired up and waiting for them."
            exit 0
          fi
          exit $status
