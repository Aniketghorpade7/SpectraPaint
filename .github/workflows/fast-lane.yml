name: Fast lane

# Runs on every push. Kept to work that needs no model weights, so it stays in seconds and stays
# inside the metered Actions minutes of a private repository — see docs/design-decisions.md §9b.
#
# Both operating systems, deliberately: the shipping target is Windows while development happens on
# Linux, and three failure modes pass on one and break on the other (§9c). This matrix is the only
# thing that catches them without a Windows machine to hand.

on:
  push:
  pull_request:
    branches: [main]

# A superseded run has nothing to tell us, and its minutes are billed either way.
concurrency:
  group: fast-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Do not cancel Windows because Linux failed, or vice versa: which platform broke is the
      # information worth having.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, format and shell tests
        run: npm run check

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/inference/uv.lock

      - name: Install the service
        working-directory: services/inference
        run: uv sync --python 3.12

      - name: Lint and format the Python
        working-directory: services/inference
        # Checked from the repository root, so tools/ and spikes/ are covered too — the CI gates
        # and the benchmark are Python that agents edit, and unlinted code is where drift hides.
        run: |
          uv run ruff check ../..
          uv run ruff format --check ../..

      - name: Service tests
        working-directory: services/inference
        # The lifecycle tests spawn the real service and talk to it over a socket, which is what
        # makes this matrix worth paying for: a Windows-only handshake or process-teardown fault
        # shows up here rather than on a Dealer's machine.
        run: uv run pytest -m "not models" -q

      - name: Licence gate
        # Linux only: dependency licences do not vary by runner, and the second run would be
        # minutes spent to learn the same thing twice.
        if: runner.os == 'Linux'
        working-directory: services/inference
        # Run from the service directory so its environment is the one being inspected — the gate
        # reads Python licences from the interpreter it runs under.
        run: uv run python ../../tools/licence_gate.py

  performance:
    name: Performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A separate job on purpose. It needs nothing but numpy, so it does not wait behind npm, and a
    # runner doing nothing else gives a measurement worth comparing against a recorded baseline.
    #
    # The standard private-repo runner is 2-core / 7 GB — roughly floor-tier shop hardware — so this
    # doubles as a continuous check on the machine class the local-first architecture assumes
    # (design-decisions.md §9b).

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Per-shade render regression gate
        id: gate
        # numpy is pinned to a major range: the baseline was recorded against numpy 2, and a major
        # version change is a reason to re-record rather than to trust the comparison.
        run: >
          uv run --python 3.12 --with "numpy>=2,<3" --with "."
          python spikes/latency/bench_render_loop.py --check

      - name: Measurements for re-recording the baseline
        # Only when the gate failed, and only because the first question then is always "what are
        # the numbers on this runner today?" This prints them ready to paste.
        if: failure() && steps.gate.outcome == 'failure'
        run: >
          uv run --python 3.12 --with "numpy>=2,<3" --with "."
          python spikes/latency/bench_render_loop.py --json
