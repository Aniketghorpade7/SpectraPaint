  { name = "config.json", sha256 = "3239c7ecf212b1a9d9f98310c8993612335c5596a12c8cfba25e512e9dc5965b", size_bytes = 5697 },
  { name = "preprocessor_config.json", sha256 = "6ebf229ee259368ce4a8d4f2fe893a72b053023710853e257253939e601f583d", size_bytes = 683 },
