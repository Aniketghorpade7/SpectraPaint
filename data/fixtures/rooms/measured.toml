# What wall detection actually scores on these photographs, measured — not what it should score.
#
# Read this together with #31 and docs/technical-difficulties.md difficulty 12. The floors in
# services/inference/tests/api/test_walls.py (wall IoU 0.60, non-wall leakage 0.20) were written
# before any real photograph existed, and were described in that file as regression floors chosen
# without measurements. The first measurements say the pipeline does not clear them: the matte paints
# a door, a curtain and a line of hanging clothes, because the semantic checkpoint labels those
# pixels `wall` with high confidence. That is #31's to fix and cannot be fixed by editing a number.
#
# So the tests assert **this file** — no worse than what was measured — and keep those floors as the
# targets #31 closes. The distinction from "re-recording a baseline to get to green"
# (conventions.md §7b, which forbids that) is that no baseline existed here: this is the first
# measurement, taken deliberately, with the shortfall recorded in three places rather than smoothed
# over. A number here going the wrong way is a regression and fails the lane. A number crossing its
# target also fails the lane, with a message saying to tighten this file — the ratchet only turns one
# way, and these entries are meant to disappear.
#
# Measured on: 2026-08-21, Linux, CPU, the checkpoints pinned in models/manifest.toml.
# Re-measured: 2026-09-15, after the wall-confidence floor in matte.py (#31, candidate direction 1).
# Re-measured: 2026-09-16, adding dim-room-with-mirror and patterned-wallpaper-with-curtain to the
#               labelled set (issue #33). The shadowed-wall recall floor joined this ratchet then
#               too: dim-room's chair shadow is its first real failure — a shadow fan the matte
#               drops wholesale, for the reason no threshold edit fixes (#31).
# Measured 2026-10-07, for #51: the surplus of razor edges on SegFormer's 128-grid lines over the
#               chance level of a matte unrelated to the grid (tests/segmentation/grid_metric.py).
#               Nothing is recorded below for it, because every plane is under the 0.15 target. The
#               values, as the fraction minus chance (edges counted) per plane:
#                 corner-with-clothesline   -0.004 (497), +0.000 (503)
#                 dim-room-with-mirror      +0.002 (318), -0.002 (307)
#                 empty-corner              +0.002 (798), +0.002 (798); ceiling has no razor edge
#                 patterned-wallpaper-...   no razor edge at all
#                 windows-with-curtains     -0.001 (506), +0.019 (423)
#                 wood-doors-with-mirror    +0.008 (875), -0.093 (1104), ceiling -0.339 (74)
#               Before #51 the same planes read +0.2 to +0.36 (0.50-0.66 against ~0.30 chance), on
#               every fixture but windows-with-curtains, which was already at chance.
# Re-measured: 2026-10-09, for #48: `mirror` with `wall` as runner-up is held to a 0.10 wall-
#               confidence floor instead of 0.9, and five photographs joined the labelled set
#               (blue-wall-sunlit, green-room-sunlit, yellow-wall-sunlight-band from the
#               Dealer-testing report; wood-doors-with-mirror, labelled; kitchen-tiles, unlabelled).
#               sunlit_wall_recall, the brightest tenth of the labelled wall, joined the ratchet.
#               Page 6 of the report (blue-wall-sunlit): IoU 0.693 -> 0.855, darkest-quarter recall
#               0.271 -> 0.906 (that quarter is mostly the sunlit recessed wall). Costs:
#               windows-with-curtains leakage 0.191 -> 0.210 (entry below, accepted), and
#               corner-with-clothesline leakage up 0.006 to about 0.358. That is inside the 0.02
#               tolerance of its 0.338 entry and left untightened, but #51 had already moved it
#               0.014, so its headroom is gone.
#               Mirror leakage, the matte's mean over the mirror itself, measured not assumed:
#               wood-doors-with-mirror 0.044 and dim-room-with-mirror 0.993, both unchanged by #48,
#               because the checkpoint does not call either mirror `mirror`. dim-room's mirror was
#               already painted before #48; it is labelled unsure, so no metric here counts it.
# Regenerate after a pipeline change with the reasoning in the commit message:
#     cd services/inference && uv run pytest -m models -q     # the failure message prints the new value

# Only the metrics that fall short are recorded. A metric that already meets its target has no
# entry, and the lane fails if one appears — see the ratchet in tests/api/test_walls.py. Wall IoU is
# absent for two rooms because they clear it (0.944 and 0.771); the shadowed-wall recall of the
# three original rooms clears its own target too (windows-with-curtains by only 0.001 — 0.801
# against 0.80, from 0.910 before the floor, which is the floor's real cost and the number to
# watch), so it appeared nowhere here until dim-room-with-mirror arrived and became its first
# recorded failure.

[dim-room-with-mirror]
# The chair's shadow fan across the tiled wainscot: SAM 2 cuts at the shadow's edge and drops
# 26% of the darkest quarter of the wall (0.737 against the 0.80 target), mostly the left wall's
# tile between y~600 and the baseboard. This is the failure the shadow criterion exists to catch,
# on the first photograph strong enough to trigger it — the semantic pass's override recovers the
# curtain-side shadows but not a shadow this deep. Containing it needs #31's direction: the
# shadow's edge must reach SAM 2 as a negative prompt, not look like an object edge. Wall IoU and
# non-wall leakage both clear their targets on this photo (0.823 and 0.069) and have no entries.
shadowed_wall_recall = 0.737

[corner-with-clothesline]
# The matte paints the clothes hanging across the corner. The confidence floor cuts 0.348 to 0.338:
# SegFormer calls those clothes `wall` at 99%, so almost none of the over-claim falls below the
# floor. Containing this one needs the clothes to reach SAM 2 as negative prompts (#31).
non_wall_leakage = 0.338

[empty-corner]
# The matte paints the door at the right edge. Barely over the 0.20 target, and the least fixable of
# the three: the semantic pass calls that door `wall` at 0.97 confidence. The confidence floor moves
# this by nothing at all (0.209 before and after) — exactly as predicted, because a floor can only
# remove what the checkpoint was unsure of and it is not unsure here.
non_wall_leakage = 0.209

[windows-with-curtains]
# The matte paints the curtains and the window glass. The IoU shortfall is the same defect seen from
# the other side: certain wall is 10% of this frame and the matte claims 40% of it. The confidence
# floor helps most here — leakage 0.239 to 0.185, which clears the 0.20 target, so that metric has
# no entry any more. IoU improves 0.369 to 0.389 and is still far short.
wall_iou = 0.389
# Leakage is back, deliberately, and this entry is not a re-recorded baseline. #48 lowers the floor
# for pixels the checkpoint calls `mirror` with `wall` as its runner-up, because that is how it
# sees sunlit wall. It sees some of this photo's night window glass and lit curtains the same way,
# so leakage went 0.191 (after #51) to 0.210. Every rule measured that brings the page-6 sunlit
# wall back costs this photo at least 0.004 over the target. The repository owner accepted that
# trade on 2026-10-09, and decision 54 records it. If this rises past 0.230, or a real mirror is
# painted in a fixture, reopen decision 3 in docs/bugs/README.md.
non_wall_leakage = 0.210

[yellow-wall-sunlight-band]
# The sunlit yellow wall from page 7 of the Dealer-testing report (bug 9), added for #48 and not
# fixed by it: the checkpoint calls 66% of this wall `wardrobe`, not `mirror`, so the confidence
# floor deletes it and the matte covers 11% of the frame. #60 tracks it, and its plane label is
# withheld until then (tools/fixtures/label_rooms.py says why).
wall_iou = 0.132
shadowed_wall_recall = 0.150
sunlit_wall_recall = 0.000
